<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your order · Poffi Stack</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F34902">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/fredoka-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<script type="module" src="/assets/js/order.js"></script>
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/" aria-label="Poffi Stack home"><img src="/assets/img/logo-disc-96.png" alt="" width="46" height="46"><span>Poffi Stack</span></a>
    <nav class="nav" aria-label="Main"><a href="/menu">Menu</a></nav>
    <button class="cart-btn" type="button" data-open-cart aria-label="Open your order"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.5H6.2L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span class="cart-count" data-cart-count>0</span></button>
  </div>
</header>
<main id="main" class="wrap" style="padding-bottom:70px">
  <div data-hero class="order-hero"><div class="spinner" aria-label="Loading"></div><p>Loading your order…</p></div>
  <div class="checkout" data-body hidden style="padding-top:18px"></div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <div class="footer-base" style="margin-top:0;border-top:0;padding-top:0">
      <span>© <span data-year></span> Poffi Stack. Payments are processed securely by Paystack.</span>
      <a class="powered" href="https://kal-s-digital.vercel.app" rel="noopener" target="_blank">Powered by <img src="/assets/img/kals-digital-white.svg" alt="Kal’s Digital" width="110" height="30"></a>
    </div>
  </div>
</footer>
</body>
</html>
